seleave="hideStackSoon()"></div><footer>非官方个人学习模拟版 · 兵种图片来源于 Ludex / Toy Battle，版权属于 Repos Production。棋盘落点依据图片及参考资料校准，仍需实战核验。</footer></div><script>

let ws,state=null,selected=null,roomSaved=null,seatSaved=null,pendingCapnExtra=null;const fixedSeat=null;const app=document.querySelector('#app'),conn=document.querySelector('#connection');const labels={KWAK:'鸭子',SKULLY:'骷髅',CAPN:'士兵',JUMBO:'巨人',HOOK:'海盗',XB42:'机器人',STAR:'独角兽',ROXY:'恐龙'};const descriptions={KWAK:'万能战力：可覆盖任何敌军，也可被任何敌军覆盖',SKULLY:'部署后从储备抽 2 枚（最多 8 枚手牌）',CAPN:'部署后可额外部署 1 枚兵种',JUMBO:'可移除一个相邻的可见敌军',HOOK:'在普通基地可无视总部连接要求',XB42:'选择对手牌架上一枚背面牌并弃掉',STAR:'部署后抽 1 枚兵种',ROXY:'无额外能力，战力 7'};

const skillStyles={KWAK:['🦆','#ffe26a'],SKULLY:['💀','#b6dbff'],CAPN:['⚔️','#ffd578'],JUMBO:['💥','#ff9b65'],HOOK:['🏴‍☠️','#f0c17a'],XB42:['⚡','#77eaff'],STAR:['✨','#f5c1ff'],ROXY:['🦖','#ffb06d']};

function newLogLines(before,after){
 if(!before||before.room!==after.room)return [];
 const a=before.log,b=after.log;let overlap=Math.min(a.length,b.length);
 while(overlap>0&&!a.slice(-overlap).every((line,i)=>line===b[i]))overlap--;

function queueSkillEffects(before,after){
 const lines=newLogLines(before,after),added=[];
 for(const line of lines){
  const m=line.match(/^(红|蓝)方部署 (KWAK|SKULLY|CAPN|JUMBO|HOOK|XB42|STAR|ROXY) → (\w+)$/);
  if(!m)continue;
  const owner=m[1]==='红'?0:1,type=m[2],node=m[3],previous=before.board[node]?.at(-1);
  let label=`${labels[type]} · 部署`,kind='deploy',count=0;
  if(type==='KWAK'){label='鸭子 · 万能战力';kind='ability'}
  if(type==='HOOK'){label='海盗 · 奇袭部署';kind='ability'}
  if(type==='ROXY'){label='恐龙 · 战力 7';kind='ability'}

  const handBefore=owner===before.you?before.hands.length:before.enemyHand;
  if(type==='CAPN'&&handBefore>1&&after.winner===null&&after.turn===owner){label='士兵 · 额外部署';kind='ability'}
  if(type==='JUMBO'&&after.winner===null&&after.turn===owner&&after.edges.some(([a,b])=>{const other=a===node?b:b===node?a:null;return other&&other!=='R'&&other!=='B'&&after.board[other]?.at(-1)?.owner===1-owner})){label='巨人 · 选择目标';kind='ability'}

}

function viewPos(x,y,me){return me===0?[y,100-x]:[100-y,x]}
function render(){hideStackNow();if(!state){app.innerHTML=`<section class="panel lobby"><h2>公网双人对战</h2><p class="muted">创建房间后，把蓝方邀请链接发给朋友；两人分别打开链接即可对战。红方负责主持，请保持页面打开。</p><div class="actions"><button class="primary" onclick="create()">创建对局</button></div><p class="notice">每个房间独立；不要把邀请链接发给无关人员。</p></section>`;return}const s=state,me=s.you,phase=s.phase,kind=phase?.kind,turn=s.turn===me,colors=['红','蓝'];let notice=s.winner!==null?`🏆 ${colors[s.winner]}方获胜：${s.reason}`:!turn?'等待对手行动…':kind==='capn'?'士兵效果：可额外部署一枚兵种，或跳过':kind==='jumbo'?'巨人效果：点击相邻敌军移除，或跳过':kind==='xb42'?'机器人效果：请选择对方牌架上一张背面牌弃掉':kind==='retreat'?'城堡效果：点击其他位置的己方兵种收回手牌，或跳过':kind==='suppress'?'狙击效果：选择对手一张背面牌压制':kind==='exhume'?'墓园效果：从弃牌中选择一枚自己的兵种回收':'选择手牌，再点击高亮基地部署；也可以抽取 2 枚兵种';const soldierLine=kind==='capn'?s.log.slice().reverse().find(x=>/^(红|蓝)方部署 CAPN → (\w+)$/.test(x)):null,soldierNode=soldierLine?.match(/→ (\w+)$/)?.[1],soldierY=s.nodes[soldierNode]?viewPos(s.nodes[soldierNode][0],s.nodes[soldierNode][1],me)[1]:70,soldierTop=Math.max(5,Math.min(76,soldierY-18));const nodeHtml=Object.entries(s.nodes).map(([id,v])=>{const [x,y,type]=v,[viewX,viewY]=viewPos(x,y,me),stack=s.board[id],t=stack.at(-1),legal=turn&&selected!==null&&(kind==null||kind==='capn')&&((s.legal[s.hands[selected]?.id]||[]).includes(id)||(kind==='capn'&&legalLocal(s.hands[selected]?.type,id)));const target=turn&&((kind==='jumbo'&&s.edges.some(([a,b])=>(a===phase.node&&b===id)||(b===phase.node&&a===id))&&t?.owner===1-me)||(kind==='retreat'&&id!==phase.node&&!['R','B'].includes(id)&&stack.some(c=>c.owner===me)));return `<div class="node ${t?(t.owner===0?'red':'blue'):''} ${type.includes('hq')?'hq':''} ${type==='special'?'special':''} ${legal?'legal':''} ${target?'target':''} ${stack.length>1?'has-stack':''}" style="left:${viewX}%;top:${viewY}%" onclick="clickNode('${id}')" ${stack.length>1?`tabindex="0" aria-describedby="stack-preview" onmouseenter="showStack(event,'${id}')" onmouseleave="hideStackSoon()" onfocus="showStack(event,'${id}')" onblur="hideStackSoon()"`:''} title="${id}${type==='special'?' · 城堡撤回基地':''}${stack.length?' · 叠放'+stack.length+'枚':''}">${t?`<img class="piece-img ${t.owner===me?'own-piece':'enemy-piece'}" src="${piece(t.type,t.owner)}" alt="${labels[t.type]}">`:type==='redhq'?'🏰':type==='bluehq'?'🏯':type==='special'?'✦':'◈'}${t?`<span class="strength">${t.type==='KWAK'?'★':s.types[t.type].strength}</span>`:''}${stack.length>1?`<button type="button" class="stack stack-inspect" title="查看叠放" aria-label="查看 ${id} 的 ${stack.length} 层棋子" onclick="inspectStack(event,'${id}')">查看 ×${stack.length}</button>`:''}</div>`}).join('');let paths=s.edges.map(([a,b])=>{let x=s.nodes[a],y=s.nodes[b];return `<line x1="${x[0]}" y1="${x[1]}" x2="${y[0]}" y2="${y[1]}" stroke="#e4d2a3" stroke-width=".95" stroke-linecap="round" opacity=".75"/>`}).join('');let medals=s.regionDefs.map(r=>`<div class="medal ${s.regions[r.id]!==undefined?'taken':''}" data-medals="${r.medals}" style="left:${viewPos(r.pos[0],r.pos[1],me)[0]}%;top:${viewPos(r.pos[0],r.pos[1],me)[1]}%">已领取</div>`).join('');app.innerHTML=`<div class="layout"><section class="panel game-frame"><div class="game-heading"><b>🗺️ ${s.mapName||'城堡战场'}</b><button class="map-gallery-button" onclick="openMaps()">切换 / 查看棋盘</button>${relay?.invites?'<button class="map-gallery-button" onclick="showInvite()">邀请朋友</button>':''}<span class="pill">房间 ${s.room}</span></div><div class="table-layout"><div class="play-column"><div class="opponent-rack"><div class="rack-heading"><span>对手牌架 · ${colors[1-me]}方　${s.enemyHand}/8</span>${['xb42','suppress'].includes(kind)&&turn?'<span class="rack-hint">选择一张背面牌</span>':''}</div><div class="enemy-hand">${Array.from({length:s.enemyHand},(_,i)=>`<button type="button" class="enemy-card ${me===1?'enemy-red':'enemy-blue'} ${['xb42','suppress'].includes(kind)&&turn?'pickable':''}" aria-label="对手第 ${i+1} 张背面牌" title="对手第 ${i+1} 张背面牌" ${['xb42','suppress'].includes(kind)&&turn?`onclick="pickEnemyCard(${i})"`:'disabled'}><span class="slot-number">${i+1}</span></button>`).join('')||'<span class="muted">对手暂无手牌</span>'}</div></div><div class="board ${me===0?'red-view':'blue-view'}" style="aspect-ratio:${s.mapAspect||'866/1440'}"><img class="board-map" src="${s.mapImage||'./board-assets/49ea55d2ec23d31e.png'}" alt="${s.mapName||'城堡战场'}地图"><svg class="paths" viewBox="0 0 100 100" preserveAspectRatio="none">${paths}</svg>${medals}${nodeHtml}${turn&&kind==='capn'?`<div class="soldier-prompt" role="status" style="top:${soldierTop}%"><strong>⚔️ 士兵技能 · 额外部署</strong><span>${selected===null?'选择手牌，再点击棋盘高亮位置':'点击棋盘高亮位置部署'}</span><button type="button" onclick="send('skip')">跳过</button></div>`:''}</div><div class="own-rack-panel"><div class="stat"><b>你的牌架 · ${colors[me]}方</b><span>${s.hands.length}/8</span></div><div class="hand">${s.hands.map((c,i)=>`<div class="card ${me===0?'red':'blue'} ${selected===i?'active':''} ${s.blocked===c.id?'blocked':''}" onclick="selectCard(${i})" title="${descriptions[c.type]}"><img class="piece-img" src="${piece(c.type,me)}" alt="${labels[c.type]}"><b>${labels[c.type]}</b><small>${c.type==='KWAK'?'★ 万能':s.types[c.type].strength+' 战力'}</small></div>`).join('')||'<span class="muted">暂无手牌</span>'}</div></div></div><aside class="status-rail" aria-label="对局状态"><div class="status-title">对局状态</div><div class="status-row"><span>你是</span><b>${colors[me]}方</b></div><div class="status-row"><span>行动</span><b>${colors[s.turn]}方</b></div><div class="status-row score-red"><span>🔴 奖章</span><b>${s.medals[0]}/${s.objective||7}</b></div><div class="status-row score-blue"><span>🔵 奖章</span><b>${s.medals[1]}/${s.objective||7}</b></div><div class="status-row"><span>对手牌</span><b>${s.enemyHand}</b></div><div class="status-row"><span>己方储备</span><b>${s.decks[me]}</b></div><div class="status-row"><span>对方储备</span><b>${s.decks[1-me]}</b></div><div class="status-row"><span>行动数</span><b>${s.count}</b></div><p class="status-notice">${notice}</p>${turn&&kind==='exhume'?`<div class="exhume-choices">${s.exhumeOptions.map(c=>`<button onclick="send('exhume_pick',{cardId:'${c.id}'})">回收 ${labels[c.type]}</button>`).join('')}</div>`:''}<div class="actions">${turn&&!kind&&s.winner===null?`<button class="primary" onclick="send('draw')" ${s.decks[me]===0||s.hands.length===8?'disabled':''}>🎴 抽取 2 枚</button>`:''}${turn&&['jumbo','retreat','exhume'].includes(kind)?'<button onclick="send(\'skip\')">跳过可选效果</button>':''}<button class="restart-button" type="button" onclick="restartGame()">↻ 重新开始</button></div><div class="music-controls"><button type="button" class="music-toggle" id="music-toggle" onclick="toggleMusic()" aria-pressed="false">♫ 开启音乐</button><label for="music-volume">音量 <input id="music-volume" type="range" min="0" max="100" step="1" value="30" oninput="setMusicVolume(this.value)" aria-label="背景音乐音量"></label><p class="music-note" id="music-note">本机播放</p></div><details class="status-log"><summary>战报</summary><div class="log">${s.log.slice().reverse().map(x=>`<div>• ${x}</div>`).join('')}</div></details></aside></div><div class="notice game-notice">⚠️ 棋盘依据参考资料校准；区域领取状态以标签为准。</div><details class="ability-details"><summary>查看 8 种兵种能力</summary>${Object.entries(descriptions).map(([k,v])=>`<p><b>${labels[k]}：</b>${v}</p>`).join('')}</details></section></div>`;restoreSkillEffect();syncMusicControls()}
const bgMusic=document.querySelector('#background-music');
function readMusicSetting(key,fallback){try{return localStorage.getItem(key)??fallback}catch{return fallback}}
function saveMusicSetting(key,value){try{localStorage.setItem(key,String(value))}catch{}}
let musicVolume=Math.max(0,Math.min(100,Number(readMusicSetting('toyMusicVolume','30'))||0));
bgMusic.volume=musicVolume/100;
function syncMusicControls(){const button=document.querySelector('#music-toggle'),slider=document.querySelector('#music-volume'),note=document.querySelector('#music-note');if(!button)return;const playing=!bgMusic.paused;button.textContent=playing?'❚❚ 暂停音乐':'♫ 开启音乐';button.setAttribute('aria-pressed',String(playing));if(slider)slider.value=musicVolume;if(note)note.textContent=bgMusic.error?'音乐加载失败，请刷新重试':'本机播放';}
async function toggleMusic(){if(!bgMusic.paused){bgMusic.pause();saveMusicSetting('toyMusicEnabled','0');syncMusicControls();return}try{await bgMusic.play();saveMusicSetting('toyMusicEnabled','1')}catch{saveMusicSetting('toyMusicEnabled','0')}syncMusicControls()}
function setMusicVolume(value){musicVolume=Math.max(0,Math.min(100,Number(value)||0));bgMusic.volume=musicVolume/100;saveMusicSetting('toyMusicVolume',musicVolume)}
bgMusic.addEventListener('play',syncMusicControls);bgMusic.addEventListener('pause',syncMusicControls);bgMusic.addEventListener('error',syncMusicControls);
if(readMusicSetting('toyMusicEnabled','0')==='1')bgMusic.play().catch(()=>syncMusicControls());
let stackHideTimer;
function hideStackNow(){clearTimeout(stackHideTimer);document.querySelector('#stack-preview').hidden=true}
function hideStackSoon(){clearTimeout(stackHideTimer);stackHideTimer=setTimeout(()=>{document.querySelector('#stack-preview').hidden=true},180)}
function keepStackPreview(){clearTimeout(stackHideTimer)}
function showStack(event,id){
 const stack=state?.board[id];if(!stack||stack.length<2)return;
 keepStackPreview();const panel=document.querySelector('#stack-preview');panel.classList.toggle('nonblocking',state.turn===state.you&&(selected!==null||['retreat','jumbo'].includes(state.phase?.kind)));panel.replaceChildren();
 const heading=document.createElement('header');heading.textContent=`基地 ${id} · 共 ${stack.length} 层（从上到下）`;panel.appendChild(heading);
 const list=document.createElement('div');list.className='stack-list';
 [...stack].reverse().forEach((card,index)=>{const item=document.createElement('div');item.className='stack-card';const img=document.createElement('img');img.className='piece-img';img.src=piece(card.type,card.owner);img.alt=labels[card.type];item.appendChild(img);const level=document.createElement('span');level.className='stack-level';level.textContent=index===0?'顶层':`第 ${index+1} 层`;item.appendChild(level);const name=document.createElement('span');name.className=card.owner===0?'stack-owner-red':'stack-owner-blue';name.textContent=`${card.owner===0?'红':'蓝'}方 ${labels[card.type]}`;item.appendChild(name);list.appendChild(item)});
 panel.appendChild(list);panel.hidden=false;const anchor=event.currentTarget.getBoundingClientRect(),box=panel.getBoundingClientRect();
 let left=anchor.right+10;if(left+box.width>window.innerWidth-8)left=anchor.left-box.width-10;left=Math.max(8,Math.min(left,window.innerWidth-box.width-8));
 let top=Math.max(8,Math.min(anchor.top,window.innerHeight-box.height-8));panel.style.left=left+'px';panel.style.top=top+'px';
}
function inspectStack(event,id){event.stopPropagation();showStack(event,id)}
function pickEnemyCard(index){if(state?.turn===state?.you&&['xb42','suppress'].includes(state.phase?.kind))send(state.phase.kind==='xb42'?'xb42_pick':'suppress_pick',{index})}

function showRetreatChoice(n){
 const dialog=document.querySelector('#retreat-dialog'),list=document.querySelector('#retreat-list'),stack=state.board[n];list.replaceChildren();hideStackNow();
 [...stack].reverse().forEach((card,i)=>{const button=document.createElement('button');button.type='button';button.className='retreat-card';button.disabled=card.owner!==state.you;button.setAttribute('aria-label',`${i===0?'顶层':`第 ${i+1} 层`} ${card.owner===0?'红':'蓝'}方 ${labels[card.type]}${button.disabled?' 对方棋子':' 回收'}`);const img=document.createElement('img');img.className='piece-img';img.src=piece(card.type,card.owner);img.alt='';button.appendChild(img);const label=document.createElement('span');label.textContent=`${i===0?'顶层':`第 ${i+1} 层`} · ${card.owner===0?'红':'蓝'}方 ${labels[card.type]}`;button.appendChild(label);if(!button.disabled)button.onclick=()=>{dialog.close();send('retreat',{node:n,cardId:card.id})};list.appendChild(button)});
 if(!dialog.open)dialog.showModal();
}
function restartGame(){if(state)document.querySelector('#restart-dialog').showModal()}
function confirmRestart(){document.querySelector('#restart-dialog').close();pendingCapnExtra=null;send('restart')}
function selectCard(i){if(!state||state.turn!==state.you||state.winner!==null)return;if(state.phase&&!['capn'].includes(state.phase.kind))return;if(state.hands[i]?.id===state.blocked){alert('这枚兵种本回合被狙击压制');return}selected=i;render()}
function legalLocal(t,n){if(!t||!state)return false;let s=state,p=s.you,hqs=s.hqs||[['R'],['B']],own=hqs[p],enemy=hqs[1-p];if(own.includes(n))return false;let gate=s.gates?.[n];if(gate&&!gate.includes(t==='KWAK'?'joker':String(s.types[t].strength)))return false;let top=s.board[n].at(-1);if(!enemy.includes(n)&&top&&top.owner!==p&&t!=='KWAK'&&top.type!=='KWAK'&&s.types[t].strength<=s.types[top.type].strength)return false;if(!enemy.includes(n)&&t==='HOOK')return true;let visited=new Set(own),q=[...own];while(q.length){let x=q.shift();for(let [a,b] of s.edges){let y=a===x?b:b===x?a:null;if(y&&!visited.has(y)&&s.board[y].at(-1)?.owner===p&&!hqs.flat().includes(y)){visited.add(y);q.push(y)}}}return s.edges.some(([a,b])=>(visited.has(a)&&b===n)||(visited.has(b)&&a===n))}
let pendingMap=null;function confirmMap(){document.querySelector('#map-confirm').close();if(pendingMap)send('select_map',{map:pendingMap});pendingMap=null}
function openMaps(){const entries=[['castle','城堡战场',null,true],['battlefield','战场','battlefield.jpg',true],['tropical-pool','热带泳池','tropical-pool.jpg',true],['cursed-cemetery','诅咒墓园','cursed-cemetery.jpg',true],['station-metal-x','金属太空站','station-metal-x.jpg',true],['sky-art','天空插画','sky-art.png',false],['lava-art','熔岩插画','lava-art.png',false]];const grid=document.querySelector('#map-grid');grid.replaceChildren();for(const [id,name,img,playable] of entries){let tile=document.createElement('div');tile.className='map-tile';if(img){let image=document.createElement('img');image.src='./board-assets/'+img;image.alt=name;tile.append(image)}let title=document.createElement('b');title.textContent=name;tile.append(title);let note=document.createElement('small');note.textContent=playable?'可开始对战':'仅供图片预览，规则和落点未校准';tile.append(note);let btn=document.createElement('button');btn.textContent=playable?(state.mapId===id?'重新选择':'选择地图'):'查看原图';btn.onclick=()=>{if(!playable){window.open('./board-assets/'+img,'_blank');return}pendingMap=id;document.querySelector('#map-dialog').close();document.querySelector('#map-confirm-text').textContent='切换到'+name+'将清空当前对局并重新发牌。';document.querySelector('#map-confirm').showModal()};tile.append(btn);grid.append(tile)}document.querySelector('#map-dialog').showModal()}

function clickNode(n){if(!state||state.turn!==state.you||state.winner!==null)return;let kind=state.phase?.kind;if(kind==='jumbo'){send('jumbo',{node:n});return}if(kind==='retreat'){const stack=state.board[n];if(n===state.phase.node||!stack?.some(c=>c.owner===state.you))return;if(stack.length>1)showRetreatChoice(n);else send('retreat',{node:n,cardId:stack[0].id});return}if(selected===null)return;if(kind==='capn'){if(ws?.readyState!==1)return;pendingCapnExtra={room:state.room,id:state.hands[selected].id,node:n};send('extra',{index:selected,node:n});return}send('place',{index:selected,node:n})}connect();
</script></body></html>
