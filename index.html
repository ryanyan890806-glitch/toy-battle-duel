/* Unified tabletop: both racks, battlefield and a compact vertical status rail. */
.layout{display:block;margin-top:14px}.game-frame{--field-width:clamp(340px,calc((100vh - 220px)*.6014),470px);max-width:calc(var(--field-width) + 164px);margin:0 auto;padding:12px 14px 13px}.game-heading{display:flex;justify-content:space-between;align-items:center;gap:8px;margin:0 auto 8px;max-width:620px}.game-heading b{font-size:15px}.game-heading .pill{font-size:11px;white-space:nowrap}.table-layout{display:grid;grid-template-columns:minmax(0,var(--field-width)) minmax(90px,126px);justify-content:center;align-items:start;gap:10px}.play-column{min-width:0}.play-column .board{width:100%;max-width:none;margin:0}.play-column .opponent-rack{width:100%;margin:0 auto 7px}.rack-heading{font-size:12px}.play-column .enemy-hand{min-height:56px;padding:4px 6px 11px}.play-column .enemy-card{flex:1 1 0;max-width:55px}.own-rack-panel{width:100%;margin:8px auto 0;padding:0;background:none;border:0;border-radius:0;box-shadow:none}.own-rack-panel .stat{font-size:12px;margin:2px 0}.own-rack-panel .hand{min-height:72px;padding:4px 6px 14px}.own-rack-panel .card{flex:1 1 0;min-width:0;width:auto;max-width:60px}.own-rack-panel .card b{font-size:10px;line-height:1.2}.status-rail{min-width:0;border:1px solid #997749;border-radius:11px;background:linear-gradient(180deg,#4a3928,#30271e);box-shadow:inset 0 1px #c8a87144;padding:8px 7px;color:#f7e8cc;font-size:11px}.status-title{font-weight:800;color:#ffe1a1;font-size:12px;border-bottom:1px solid #ad875855;padding-bottom:6px;margin-bottom:4px}.status-row{display:flex;justify-content:space-between;align-items:center;gap:4px;line-height:1.3;padding:5px 0;border-bottom:1px solid #ab8b6330}.status-row b{color:#fff3d5;white-space:nowrap;font-size:12px}.status-row.score-red b{color:#ffac98}.status-row.score-blue b{color:#a8d1ff}.status-notice{font-size:11px;line-height:1.45;color:#ffe0a4;margin:8px 0;overflow-wrap:anywhere}.status-rail .actions{display:grid;gap:5px;margin:7px 0 0}.status-rail button{font-size:11px;padding:8px 5px;border-radius:7px;line-height:1.25}.status-log{margin-top:9px;font-size:11px}.status-log summary{color:#ffe2a6}.status-log .log{margin-top:6px;height:130px;font-size:10px;line-height:1.6;overflow:auto;overflow-wrap:anywhere}.game-notice{max-width:620px;margin:8px auto 0;padding:6px 8px;font-size:10px;line-height:1.4}.ability-details{max-width:620px;margin:7px auto 0;font-size:11px}.ability-details p{margin:5px 0}.soldier-prompt{position:absolute;z-index:25;left:50%;top:9px;transform:translateX(-50%);width:min(78%,225px);padding:7px 9px;border:1px solid #ffdc7b;border-radius:10px;background:#2f261deF;box-shadow:0 4px 14px #000a;color:#fff4d7;text-align:center;pointer-events:none}.soldier-prompt strong{display:block;color:#ffe58e;font-size:13px}.soldier-prompt span{display:block;font-size:11px;line-height:1.35;margin:3px 0 5px}.soldier-prompt button{pointer-events:auto;padding:4px 12px;border:1px solid #e9c47d;border-radius:6px;background:#765a31;font-size:11px}.soldier-prompt button:hover{background:#9d7743}
@media(max-width:550px){.game-frame{padding:9px 8px;--field-width:470px}.game-heading b{font-size:13px}.table-layout{grid-template-columns:minmax(0,1fr) 86px;gap:6px}.status-rail{font-size:10px;padding:6px 5px}.status-title,.status-row b{font-size:11px}.status-notice{font-size:10px}.status-rail button{font-size:10px;padding:7px 3px}.rack-heading{font-size:10px}.rack-hint{font-size:10px}.own-rack-panel .card b{font-size:9px}.soldier-prompt{width:min(82%,210px);padding:5px 6px}.soldier-prompt strong{font-size:11px}.soldier-prompt span{font-size:10px}}

.status-rail button.restart-button{background:#603b30;color:#ffdfcd;border:1px solid #a66b54}.status-rail button.restart-button:hover{background:#825141}

.restart-dialog{width:min(400px,calc(100vw - 32px));padding:20px;border:2px solid #b58d58;border-radius:14px;background:#3a3025;color:#fff2d7;box-shadow:0 16px 55px #000a}.restart-dialog::backdrop{background:#0f0b08aa}.restart-dialog h2{margin:0 0 8px;font-size:19px;color:#ffe1a1}.restart-dialog p{margin:0;line-height:1.5}.restart-dialog-actions{display:flex;gap:10px;justify-content:flex-end;margin-top:18px}.restart-dialog-actions button{padding:9px 14px;font-size:13px}

.node .stack-inspect{position:absolute;bottom:-13px;left:50%;transform:translateX(-50%);white-space:nowrap;padding:3px 6px;border:1px solid #d5c29a;border-radius:8px;background:#26313d;color:#fff1ce;font-size:10px;line-height:1.2;z-index:5;cursor:pointer;touch-action:manipulation}.node .stack-inspect:hover,.node .stack-inspect:focus-visible{background:#6a5435;outline:2px solid #ffe487}.stack-preview.nonblocking{pointer-events:none}.retreat-dialog{width:min(520px,calc(100vw - 32px))}.retreat-list{display:flex;gap:8px;flex-wrap:wrap;margin-top:14px;max-height:50vh;overflow:auto}.retreat-card{width:92px;display:flex;flex-direction:column;align-items:center;gap:5px;background:#695539;border:2px solid #e9c575;padding:6px;font-size:11px;line-height:1.3}.retreat-card img{width:64px;height:auto}.retreat-card:disabled{opacity:.45;filter:grayscale(.4);cursor:not-allowed}.retreat-card:not(:disabled):hover{outline:3px solid #ffe487}

.map-browser{width:min(980px,95vw);max-height:90vh;overflow:auto;background:#3a3025;color:#fff2d7;border:2px solid #b58d58;border-radius:14px;padding:18px}.map-browser::backdrop{background:#000b}.map-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(145px,1fr));gap:12px}.map-tile{background:#524631;border-radius:10px;padding:8px}.map-tile img{width:100%;aspect-ratio:3/4;object-fit:contain;background:#221b15}.map-tile b,.map-tile small{display:block;margin:5px}.map-tile button{width:100%;padding:8px}.card.blocked{opacity:.4;filter:grayscale(1)}.map-gallery-button{font-size:12px;padding:7px}.exhume-choices button{display:block;width:100%;margin:4px 0;padding:7px}

.wrap > header {position:relative}
.album-tools {display:flex; align-items:center; flex-wrap:wrap; gap:8px}
#album-toggle, .album-panel button {font:inherit; font-size:13px; font-weight:650; padding:6px 10px; border-radius:8px; border:1px solid #ad8758; background:#504532; color:#fff0c6; cursor:pointer}
#album-toggle[aria-expanded=true] {background:#795b32}
.album-panel {position:absolute; z-index:110; top:calc(100% + 6px); right:0; width:min(400px,100%); box-sizing:border-box; padding:8px; border:1px solid #ad8758; border-radius:12px; background:#312c26; color:#fff0c6; box-shadow:0 5px 24px #0008}
.album-panel[hidden] {display:none}
.album-panel iframe {display:block; width:100%; aspect-ratio:16/9; height:auto; border:0; border-radius:8px; background:#252525}
.album-picker {display:grid; gap:6px; margin:2px 0 9px; font-size:14px; font-weight:700}
.album-picker select {width:100%; box-sizing:border-box; padding:7px 9px; background:#4c4033; color:#fff1d6; border:1px solid #ad8758; border-radius:6px; font:inherit}
.album-actions {display:flex; align-items:center; justify-content:flex-end; flex-wrap:wrap; gap:8px; margin-top:8px}
.album-actions a {color:#ffda9a; font-size:13px; margin-right:auto}

function newLogLines(before,after){
 if(!before||before.room!==after.room)return [];
 const a=before.log,b=after.log;let overlap=Math.min(a.length,b.length);
 while(overlap>0&&!a.slice(-overlap).every((line,i)=>line===b[i]))overlap--;

}
function queueSkillEffects(before,after){

 for(const line of lines){
  const m=line.match(/^(红|蓝)方部署 (KWAK|SKULLY|CAPN|JUMBO|HOOK|XB42|STAR|ROXY) → (\w+)$/);

  if(type==='HOOK'){label='海盗 · 奇袭部署';kind='ability'}
  if(type==='ROXY'){label='恐龙 · 战力 7';kind='ability'}
  const drawLine=lines.find(x=>x.startsWith(type==='SKULLY'?'骷髅补充 ':type==='STAR'?'独角兽补充 ':'\u0000'));
  if(drawLine){const found=drawLine.match(/补充 (\d+) 枚/);count=found?Number(found[1]):0;label=`${labels[type]} · 补充 ${count} 枚`;kind='ability'}
  if(type==='XB42'&&after.winner===null&&after.turn===owner&&(owner===after.you?after.phase?.kind==='xb42':before.enemyHand===undefined?false:before.hands.length>0)){label='机器人 · 选择对方手牌';kind='ability'}
  const handBefore=owner===before.you?before.hands.length:before.enemyHand;
  if(type==='CAPN'&&handBefore>1&&after.winner===null&&after.turn===owner){label='士兵 · 额外部署';kind='ability'}
  if(type==='JUMBO'&&after.winner===null&&after.turn===owner&&after.edges.some(([a,b])=>{const other=a===node?b:b===node?a:null;return other&&other!=='R'&&other!=='B'&&after.board[other]?.at(-1)?.owner===1-owner})){label='巨人 · 选择目标';kind='ability'}

  if(previous?.type==='KWAK'&&previous.owner!==owner)added.push({type:'KWAK',node,owner:previous.owner,label:'鸭子 · 万能战力被覆盖',kind:'ability',count:0});
 }

}

function render(){hideStackNow();if(state?.stage==='lobby'){renderRoomLobby();return}if(!state){app.innerHTML=`<section class="panel lobby"><h2>公网双人对战</h2><p class="muted">创建房间后，把蓝方邀请链接发给朋友；两人分别打开链接即可对战。红方负责主持，请保持页面打开。</p><div class="actions"><button class="primary" onclick="create()">创建房间</button></div><p class="notice">每个房间独立；不要把邀请链接发给无关人员。</p></section>`;return}const s=state,me=s.you,phase=s.phase,kind=phase?.kind,turn=s.turn===me,colors=['红','蓝'];let notice=s.winner!==null?`🏆 ${colors[s.winner]}方获胜：${s.reason}`:!turn?'等待对手行动…':kind==='capn'?'士兵效果：可额外部署一枚兵种，或跳过':kind==='jumbo'?'巨人效果：点击相邻敌军移除，或跳过':kind==='xb42'?'机器人效果：请选择对方牌架上一张背面牌弃掉':kind==='retreat'?'城堡效果：点击其他位置的己方兵种收回手牌，或跳过':kind==='suppress'?'狙击效果：选择对手一张背面牌压制':kind==='exhume'?'墓园效果：从弃牌中选择一枚自己的兵种回收':'选择手牌，再点击高亮基地部署；也可以抽取 2 枚兵种';const soldierLine=kind==='capn'?s.log.slice().reverse().find(x=>/^(红|蓝)方部署 CAPN → (\w+)$/.test(x)):null,soldierNode=soldierLine?.match(/→ (\w+)$/)?.[1],soldierY=s.nodes[soldierNode]?viewPos(s.nodes[soldierNode][0],s.nodes[soldierNode][1],me)[1]:70,soldierTop=Math.max(5,Math.min(76,soldierY-18));const nodeHtml=Object.entries(s.nodes).map(([id,v])=>{const [x,y,type]=v,[viewX,viewY]=viewPos(x,y,me),stack=s.board[id],t=stack.at(-1),legal=turn&&selected!==null&&(kind==null||kind==='capn')&&((s.legal[s.hands[selected]?.id]||[]).includes(id)||(kind==='capn'&&legalLocal(s.hands[selected]?.type,id)));const target=turn&&((kind==='jumbo'&&s.edges.some(([a,b])=>(a===phase.node&&b===id)||(b===phase.node&&a===id))&&t?.owner===1-me)||(kind==='retreat'&&id!==phase.node&&!['R','B'].includes(id)&&stack.some(c=>c.owner===me)));return `<div class="node ${t?(t.owner===0?'red':'blue'):''} ${type.includes('hq')?'hq':''} ${type==='special'?'special':''} ${legal?'legal':''} ${target?'target':''} ${stack.length>1?'has-stack':''}" style="left:${viewX}%;top:${viewY}%" onclick="clickNode('${id}')" ${stack.length>1?`tabindex="0" aria-describedby="stack-preview" onmouseenter="showStack(event,'${id}')" onmouseleave="hideStackSoon()" onfocus="showStack(event,'${id}')" onblur="hideStackSoon()"`:''} title="${id}${type==='special'?' · 城堡撤回基地':''}${stack.length?' · 叠放'+stack.length+'枚':''}">${t?`<img class="piece-img ${t.owner===me?'own-piece':'enemy-piece'}" src="${piece(t.type,t.owner)}" alt="${labels[t.type]}">`:type==='redhq'?'🏰':type==='bluehq'?'🏯':type==='special'?'✦':'◈'}${t?`<span class="strength">${t.type==='KWAK'?'★':s.types[t.type].strength}</span>`:''}${stack.length>1?`<button type="button" class="stack stack-inspect" title="查看叠放" aria-label="查看 ${id} 的 ${stack.length} 层棋子" onclick="inspectStack(event,'${id}')">查看 ×${stack.length}</button>`:''}</div>`}).join('');let paths=s.edges.map(([a,b])=>{let x=s.nodes[a],y=s.nodes[b];return `<line x1="${x[0]}" y1="${x[1]}" x2="${y[0]}" y2="${y[1]}" stroke="#e4d2a3" stroke-width=".95" stroke-linecap="round" opacity=".75"/>`}).join('');let medals=s.regionDefs.map(r=>`<div class="medal ${s.regions[r.id]!==undefined?'taken':''}" data-medals="${r.medals}" style="left:${viewPos(r.pos[0],r.pos[1],me)[0]}%;top:${viewPos(r.pos[0],r.pos[1],me)[1]}%">已领取</div>`).join('');app.innerHTML=`<div class="layout"><section class="panel game-frame"><div class="game-heading"><b>🗺️ ${s.mapName||'城堡战场'}</b><button class="map-gallery-button" onclick="openMaps()">切换 / 查看棋盘</button>${relay?.invites?'<button class="map-gallery-button" onclick="showInvite()">邀请朋友</button>':''}<span class="pill">房间 ${s.room}</span></div><div class="table-layout"><div class="play-column"><div class="opponent-rack"><div class="rack-heading"><span>对手牌架 · ${colors[1-me]}方　${s.enemyHand}/8</span>${['xb42','suppress'].includes(kind)&&turn?'<span class="rack-hint">选择一张背面牌</span>':''}</div><div class="enemy-hand">${Array.from({length:s.enemyHand},(_,i)=>`<button type="button" class="enemy-card ${me===1?'enemy-red':'enemy-blue'} ${['xb42','suppress'].includes(kind)&&turn?'pickable':''}" aria-label="对手第 ${i+1} 张背面牌" title="对手第 ${i+1} 张背面牌" ${['xb42','suppress'].includes(kind)&&turn?`onclick="pickEnemyCard(${i})"`:'disabled'}><span class="slot-number">${i+1}</span></button>`).join('')||'<span class="muted">对手暂无手牌</span>'}</div></div><div class="board ${me===0?'red-view':'blue-view'}" style="aspect-ratio:${s.mapAspect||'866/1440'}"><div class="board-map" data-art="${s.mapId||'castle'}" role="img" aria-label="${s.mapName||'城堡战场'}地图"></div><svg class="paths" viewBox="0 0 100 100" preserveAspectRatio="none">${paths}</svg>${medals}${nodeHtml}${turn&&kind==='capn'?`<div class="soldier-prompt" role="status" style="top:${soldierTop}%"><strong>⚔️ 士兵技能 · 额外部署</strong><span>${selected===null?'选择手牌，再点击棋盘高亮位置':'点击棋盘高亮位置部署'}</span><button type="button" onclick="send('skip')">跳过</button></div>`:''}</div><div class="own-rack-panel"><div class="stat"><b>你的牌架 · ${colors[me]}方</b><span>${s.hands.length}/8</span></div><div class="hand">${s.hands.map((c,i)=>`<div class="card ${me===0?'red':'blue'} ${selected===i?'active':''} ${s.blocked===c.id?'blocked':''}" onclick="selectCard(${i})" title="${descriptions[c.type]}"><img class="piece-img" src="${piece(c.type,me)}" alt="${labels[c.type]}"><b>${labels[c.type]}</b><small>${c.type==='KWAK'?'★ 万能':s.types[c.type].strength+' 战力'}</small></div>`).join('')||'<span class="muted">暂无手牌</span>'}</div></div></div><aside class="status-rail" aria-label="对局状态"><div class="status-title">对局状态</div><div class="status-row"><span>你是</span><b>${colors[me]}方</b></div><div class="status-row"><span>行动</span><b>${colors[s.turn]}方</b></div><div class="status-row score-red"><span>🔴 奖章</span><b>${s.medals[0]}/${s.objective||7}</b></div><div class="status-row score-blue"><span>🔵 奖章</span><b>${s.medals[1]}/${s.objective||7}</b></div><div class="status-row"><span>对手牌</span><b>${s.enemyHand}</b></div><div class="status-row"><span>己方储备</span><b>${s.decks[me]}</b></div><div class="status-row"><span>对方储备</span><b>${s.decks[1-me]}</b></div><div class="status-row"><span>行动数</span><b>${s.count}</b></div><p class="status-notice">${notice}</p>${turn&&kind==='exhume'?`<div class="exhume-choices">${s.exhumeOptions.map(c=>`<button onclick="send('exhume_pick',{cardId:'${c.id}'})">回收 ${labels[c.type]}</button>`).join('')}</div>`:''}<div class="actions">${turn&&!kind&&s.winner===null?`<button class="primary" onclick="send('draw')" ${s.decks[me]===0||s.hands.length===8?'disabled':''}>🎴 抽取 2 枚</button>`:''}${turn&&['jumbo','retreat','exhume'].includes(kind)?'<button onclick="send(\'skip\')">跳过可选效果</button>':''}<button class="restart-button" type="button" onclick="restartGame()">↻ 返回准备房间</button></div><details class="status-log"><summary>战报</summary><div class="log">${s.log.slice().reverse().map(x=>`<div>• ${x}</div>`).join('')}</div></details></aside></div><div class="notice game-notice">⚠️ 棋盘依据参考资料校准；区域领取状态以标签为准。</div><details class="ability-details"><summary>查看 8 种兵种能力</summary>${Object.entries(descriptions).map(([k,v])=>`<p><b>${labels[k]}：</b>${v}</p>`).join('')}</details></section></div>`;restoreSkillEffect()}
const albumToggle = document.getElementById('album-toggle');
const albumPanel = document.getElementById('album-panel');
const albumEmbed = document.getElementById('album-embed');
const albumSource = document.getElementById('album-source');
function loadAlbumSelection() {
  const continuous = albumSource.value === 'album';
  const frame = document.createElement('iframe');
  frame.title = continuous ? '周杰伦《八度空间》· B站全专辑连播'
    : '腾讯视频 · ' + albumSource.selectedOptions[0].textContent;
  frame.allow = 'autoplay; encrypted-media; fullscreen; picture-in-picture';
  frame.allowFullscreen = true;
  frame.referrerPolicy = 'strict-origin';
  const url = new URL(continuous ? 'https://player.bilibili.com/player.html'
    : 'https://v.qq.com/txp/iframe/player.html');
  if (continuous) {
    url.searchParams.set('bvid','BV1gU4y1C73A');
  } else {
    url.searchParams.set('vid',albumSource.value);
  }
  url.searchParams.set('autoplay','0');
  frame.src = url.href;
  albumEmbed.replaceChildren(frame);
}
albumSource.addEventListener('change', loadAlbumSelection);
function showAlbum(open) {
  if (open && !albumEmbed.firstElementChild) loadAlbumSelection();
  albumPanel.hidden = !open;
  albumToggle.setAttribute('aria-expanded', String(open));
  if (!open) albumToggle.focus({preventScroll:true});
}
albumToggle.addEventListener('click', () => showAlbum(albumPanel.hidden));
document.getElementById('album-fold').addEventListener('click', () => showAlbum(false));
document.getElementById('album-stop').addEventListener('click', () => {
  albumEmbed.replaceChildren();
  showAlbum(false);
});
albumPanel.addEventListener('keydown', event => {
  if (event.key === 'Escape') showAlbum(false);
});
let stackHideTimer;
function hideStackNow(){clearTimeout(stackHideTimer);document.querySelector('#stack-preview').hidden=true}
function hideStackSoon(){clearTimeout(stackHideTimer);stackHideTimer=setTimeout(()=>{document.querySelector('#stack-preview').hidden=true},180)}
function keepStackPreview(){clearTimeout(stackHideTimer)}
function showStack(event,id){
 const stack=state?.board[id];if(!stack||stack.length<2)return;
 keepStackPreview();const panel=document.querySelector('#stack-preview');panel.classList.toggle('nonblocking',state.turn===state.you&&(selected!==null||['retreat','jumbo'].includes(state.phase?.kind)));panel.replaceChildren();
 const heading=document.createElement('header');heading.textContent=`基地 ${id} · 共 ${stack.length} 层（从上到下）`;panel.appendChild(heading);
 const list=document.createElement('div');list.className='stack-list';
 [...stack].reverse().forEach((card,index)=>{const item=document.createElement('div');item.className='stack-card';const img=document.createElement('img');img.className='piece-img';img.src=piece(card.type,card.owner);img.alt=labels[card.type];item.appendChild(img);const level=document.createElement('span');level.className='stack-level';level.textContent=index===0?'顶层':`第 ${index+1} 层`;item.appendChild(level);const name=document.createElement('span');name.className=card.owner===0?'stack-owner-red':'stack-owner-blue';name.textContent=`${card.owner===0?'红':'蓝'}方 ${labels[card.type]}`;item.appendChild(name);list.appendChild(item)});
 panel.appendChild(list);panel.hidden=false;const anchor=event.currentTarget.getBoundingClientRect(),box=panel.getBoundingClientRect();
 let left=anchor.right+10;if(left+box.width>window.innerWidth-8)left=anchor.left-box.width-10;left=Math.max(8,Math.min(left,window.innerWidth-box.width-8));
 let top=Math.max(8,Math.min(anchor.top,window.innerHeight-box.height-8));panel.style.left=left+'px';panel.style.top=top+'px';
}
function inspectStack(event,id){event.stopPropagation();showStack(event,id)}
function pickEnemyCard(index){if(state?.turn===state?.you&&['xb42','suppress'].includes(state.phase?.kind))send(state.phase.kind==='xb42'?'xb42_pick':'suppress_pick',{index})}

function showRetreatChoice(n){
 const dialog=document.querySelector('#retreat-dialog'),list=document.querySelector('#retreat-list'),stack=state.board[n];list.replaceChildren();hideStackNow();
 [...stack].reverse().forEach((card,i)=>{const button=document.createElement('button');button.type='button';button.className='retreat-card';button.disabled=card.owner!==state.you;button.setAttribute('aria-label',`${i===0?'顶层':`第 ${i+1} 层`} ${card.owner===0?'红':'蓝'}方 ${labels[card.type]}${button.disabled?' 对方棋子':' 回收'}`);const img=document.createElement('img');img.className='piece-img';img.src=piece(card.type,card.owner);img.alt='';button.appendChild(img);const label=document.createElement('span');label.textContent=`${i===0?'顶层':`第 ${i+1} 层`} · ${card.owner===0?'红':'蓝'}方 ${labels[card.type]}`;button.appendChild(label);if(!button.disabled)button.onclick=()=>{dialog.close();send('retreat',{node:n,cardId:card.id})};list.appendChild(button)});
 if(!dialog.open)dialog.showModal();
}
function restartGame(){if(state)document.querySelector('#restart-dialog').showModal()}
function confirmRestart(){document.querySelector('#restart-dialog').close();pendingCapnExtra=null;send('restart')}
function selectCard(i){if(!state||state.turn!==state.you||state.winner!==null)return;if(state.phase&&!['capn'].includes(state.phase.kind))return;if(state.hands[i]?.id===state.blocked){alert('这枚兵种本回合被狙击压制');return}selected=i;render()}
function legalLocal(t,n){if(!t||!state)return false;let s=state,p=s.you,hqs=s.hqs||[['R'],['B']],own=hqs[p],enemy=hqs[1-p];if(own.includes(n))return false;let gate=s.gates?.[n];if(gate&&!gate.includes(t==='KWAK'?'joker':String(s.types[t].strength)))return false;let top=s.board[n].at(-1);if(!enemy.includes(n)&&top&&top.owner!==p&&t!=='KWAK'&&top.type!=='KWAK'&&s.types[t].strength<=s.types[top.type].strength)return false;if(!enemy.includes(n)&&t==='HOOK')return true;let visited=new Set(own),q=[...own];while(q.length){let x=q.shift();for(let [a,b] of s.edges){let y=a===x?b:b===x?a:null;if(y&&!visited.has(y)&&s.board[y].at(-1)?.owner===p&&!hqs.flat().includes(y)){visited.add(y);q.push(y)}}}return s.edges.some(([a,b])=>(visited.has(a)&&b===n)||(visited.has(b)&&a===n))}
let pendingMap=null;function confirmMap(){document.querySelector('#map-confirm').close();if(pendingMap)send('select_map',{map:pendingMap});pendingMap=null}
function openMaps(){const entries=[['castle','城堡战场',null,true],['battlefield','战场','battlefield.jpg',true],['tropical-pool','热带泳池','tropical-pool.jpg',true],['cursed-cemetery','诅咒墓园','cursed-cemetery.jpg',true],['station-metal-x','金属太空站','station-metal-x.jpg',true],['sky-art','天空插画','sky-art.png',false],['lava-art','熔岩插画','lava-art.png',false]];const grid=document.querySelector('#map-grid');grid.replaceChildren();for(const [id,name,img,playable] of entries){let tile=document.createElement('div');tile.className='map-tile';if(img){let image=document.createElement('img');image.src='./board-assets/'+img;image.alt=name;tile.append(image)}let title=document.createElement('b');title.textContent=name;tile.append(title);let note=document.createElement('small');note.textContent=playable?'可开始对战':'仅供图片预览，规则和落点未校准';tile.append(note);let btn=document.createElement('button');btn.textContent=playable?(state.mapId===id?'重新选择':'选择地图'):'查看原图';if(playable && state.you!==0){btn.disabled=true;btn.textContent=state.mapId===id?'本局地图':'房主选图'}btn.onclick=()=>{if(!playable){window.open('./board-assets/'+img,'_blank');return}pendingMap=id;document.querySelector('#map-dialog').close();document.querySelector('#map-confirm-text').textContent='切换到'+name+'将结束当前对局并返回准备房间。';document.querySelector('#map-confirm').showModal()};tile.append(btn);grid.append(tile)}document.querySelector('#map-dialog').showModal()}

function clickNode(n){if(!state||state.turn!==state.you||state.winner!==null)return;let kind=state.phase?.kind;if(kind==='jumbo'){send('jumbo',{node:n});return}if(kind==='retreat'){const stack=state.board[n];if(n===state.phase.node||!stack?.some(c=>c.owner===state.you))return;if(stack.length>1)showRetreatChoice(n);else send('retreat',{node:n,cardId:stack[0].id});return}if(selected===null)return;if(kind==='capn'){if(ws?.readyState!==1)return;pendingCapnExtra={room:state.room,id:state.hands[selected].id,node:n};send('extra',{index:selected,node:n});return}send('place',{index:selected,node:n})}window.addEventListener('hashchange',()=>location.reload());connect();
</script></body></html>
